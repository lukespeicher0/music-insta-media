name: feed buffer
on:
  schedule:
    - cron: "7 */6 * * *"
  push:
    paths: ["*/buffer.json", "*/pool.json", "schedule.json"]  # a new post, "Post next", a removal
  workflow_dispatch:
permissions:
  contents: write
concurrency: feed
jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python feed.py
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      - name: record sent posts
        run: |
          git config user.name "playcount feeder"
          git config user.email "feeder@users.noreply.github.com"
          git add -A  # the feeder only writes sent/expired/pool json; a pathspec that matches nothing would fail the job
          git diff --cached --quiet && exit 0
          git commit -qm "feed buffer"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
